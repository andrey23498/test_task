[project]
name = "async-payment-service"
version = "0.1.0"
description = "Asynchronous payment processing with FastAPI, RabbitMQ and transactional Outbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "faststream[rabbit]>=0.6,<0.7",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "integration: requires PostgreSQL and RabbitMQ via TEST_DATABASE_URL and TEST_RABBITMQ_URL",
    "e2e: requires running Compose services and E2E_API_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
